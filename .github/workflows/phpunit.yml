name: PHPUnit

on:
  push:
    branches: [ main ]
  pull_request: null

jobs:
  tester:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.3', '8.4', '8.5' ]
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - run: vendor/bin/phpunit --exclude-group integration tests
